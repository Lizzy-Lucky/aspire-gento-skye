    # base_link was one r=0.735 m sphere around the whole robot, so the waist and arms were
    # always in self collision. These follow meshes/skye/base_link.STL: six over the chassis
    # (bottom 5 cm above the floor) and seven up the rear column. Wheel *L_Link spheres are
    # r=0.04 so they stay clear of cuRobo's 2 cm activation distance to the floor.
