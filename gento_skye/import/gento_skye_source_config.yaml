urdf_path: /root/gpufree-data/aspire/gento-skye-import/gento_skye.urdf
name: gento_skye
headless: true
overwrite: true
merge_fixed_joints: false
dataset_name: omnigibson-robot-assets
base_motion:
  wheel_links:
  - ZQ_Link
  - ZQL_Link
  - YQ_Link
  - YQL_Link
  - ZH_Link
  - ZHL_Link
  - YH_Link
  - YHL_Link
  wheel_joints:
  - ZQ
  - ZQL
  - YQ
  - YQL
  - ZH
  - ZHL
  - YH
  - YHL
  use_sphere_wheels: true
  use_holonomic_joints: true
collision:
  decompose_method: convex
  hull_count: 8
  coacd_links: []
  convex_links: []
  no_decompose_links: []
  no_collision_links:
  - IMU_Link
  - head_depth_camera_Link
  - left_eye_camera_Link
  - right_eye_camera_Link
  - waist_depth_camera_Link
eef_vis_links:
- link: left_eef_link
  parent_link: TCP_Link_L
  offset:
    position:
    - 0
    - 0
    - 0
    orientation:
    - 0
    - 0
    - 0
    - 1
- link: right_eef_link
  parent_link: TCP_Link_R
  offset:
    position:
    - 0
    - 0
    - 0
    orientation:
    - 0
    - 0
    - 0
    - 1
camera_links:
# The housing mesh sits on the link's -Z side; the lens faces link +Z (robot
# forward) with link +Y up. A USD camera looks along its own -Z, so it is turned
# 180 deg about Y, and moved 1 cm along link +Z so it clears the housing front
# face. Identity here renders the inside of the housing (all black).
- link: head_depth_camera_Link
  parent_link: null
  offset:
    position:
    - 0
    - 0
    - 0.01
    orientation:
    - 0
    - 1
    - 0
    - 0
- link: left_eye_camera_Link
  parent_link: null
  offset:
    position:
    - 0
    - 0
    - 0
    orientation:
    - 0
    - 0
    - 0
    - 1
- link: right_eye_camera_Link
  parent_link: null
  offset:
    position:
    - 0
    - 0
    - 0
    orientation:
    - 0
    - 0
    - 0
    - 1
- link: waist_depth_camera_Link
  parent_link: null
  offset:
    position:
    - 0
    - 0
    - 0
    orientation:
    - 0
    - 0
    - 0
    - 1
# Wrist cameras are not in the URDF. These poses come from the Link8 mesh:
# the flange center, 10 mm proud of the +Z face, with the camera -Z axis
# aimed at the fingertips. Replace them when a measured mount is available.
- link: left_wrist_camera_Link
  parent_link: Link8_L
  offset:
    position:
    - 0.0229
    - 0.0
    - 0.0731
    orientation:
    - 0.7071067811865476
    - 0.7071067811865476
    - 0.0
    - 0.0
- link: right_wrist_camera_Link
  parent_link: Link8_R
  offset:
    position:
    - 0.0229
    - 0.0
    - 0.0731
    orientation:
    - 0.7071067811865476
    - 0.7071067811865476
    - 0.0
    - 0.0
lidar_links: []
curobo:
  eef_to_gripper_info:
    left_eef_link:
      links:
      - Arm_L10_Link
      - Arm_L11_Link
      joints:
      - Arm_L10_Joint
      - Arm_L11_Joint
    right_eef_link:
      links:
      - Arm_R10_Link
      - Arm_R11_Link
      joints:
      - Arm_R10_Joint
      - Arm_R11_Joint
  flip_joint_limits: []
  lock_joints: {}
  torso_joints:
  - waist_joint_1
  - waist_joint_2
  - waist_joint_3
